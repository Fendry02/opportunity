# Modèle de déploiement Fly.io pour une instance personnelle d'Opportunity.
#
# Au premier déploiement : `fly launch --copy-config` reprend ce fichier et vous
# fait choisir un nom d'app unique et une région. Puis posez vos secrets :
#   fly secrets set GOOGLE_PLACES_API_KEY=... APP_PASSWORD=...
# Créez le volume une fois :
#   fly volumes create opportunity_data --size 1 --region cdg
# Voir le README, section « Déployez votre instance ».

app = "opportunity"        # à remplacer par un nom unique
primary_region = "cdg"

[build]

[env]
  MOCK_EXTERNAL = "0"
  OPPORTUNITY_DB_PATH = "/data/opportunity.db"

[http_service]
  internal_port = 3000
  force_https = true
  # Instance perso « toujours active » : on évite qu'une machine s'arrête en
  # plein balayage (le pipeline tourne en mémoire). Passez auto_stop à "suspend"
  # pour réduire le coût si des cold starts occasionnels ne vous dérangent pas.
  auto_stop_machines = "off"
  min_machines_running = 1

[[mounts]]
  source = "opportunity_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
