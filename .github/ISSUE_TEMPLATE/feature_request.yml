name: Demande de fonctionnalité
description: Proposer une capacité qui n'existe pas encore.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Consultez d'abord la section **Hors périmètre** du README. Opportunity
        n'a délibérément ni comptes, ni backend hébergé, ni dépendance à un LLM,
        ni CRM, ni prospection automatisée. Les demandes qui vont dans ces
        directions seront fermées — non parce que ce sont de mauvaises idées,
        mais parce que c'est un autre produit.

  - type: textarea
    id: problem
    attributes:
      label: Le problème
      description: >
        Décrivez la situation dans laquelle vous êtes, pas la solution que vous
        avez en tête. Qu'essayez-vous d'accomplir, et où l'outil vous gêne-t-il
        aujourd'hui ?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Ce que vous aimeriez qu'il fasse
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Ce que vous faites à la place aujourd'hui
      description: Contournements, autres outils, étapes manuelles.

  - type: checkboxes
    id: constraints
    attributes:
      label: Compatibilité avec les contraintes du projet
      description: >
        Cochez celles que votre proposition respecte. Si elle en casse une,
        dites-le et expliquez pourquoi ça en vaut la peine — c'est un argument
        légitime, il suffit de le poser explicitement.
      options:
        - label: Fonctionne hors ligne en mode mock (`MOCK_EXTERNAL=1`)
        - label: N'ajoute aucun appel d'API facturé, ou les conditionne à une action explicite
        - label: Ne nécessite ni authentification ni service hébergé
        - label: Respecte les refus de démarchage
