name: Proposer un signal de score
description: Suggérer un nouveau défaut (ou atout) d'un site web qui devrait peser sur le score d'un prospect.
labels: ["scoring", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        C'est la contribution la plus utile au projet. Quiconque a déjà vendu
        une refonte de site connaît un indice qu'Opportunity ne cherche pas
        encore.

        Le score vit dans `lib/scoring.ts` et la détection dans
        `lib/analyzer/signals.ts` — voir la recette dans
        [CONTRIBUTING.md](../../CONTRIBUTING.md) si vous voulez l'implémenter
        vous-même.

  - type: input
    id: signal
    attributes:
      label: Le signal
      placeholder: "Le numéro de téléphone est une image au lieu de texte"
    validations:
      required: true

  - type: textarea
    id: commercial
    attributes:
      label: Pourquoi ça compte commercialement
      description: >
        Que perd réellement l'entreprise ? Cette réponse devient la phrase
        affichée dans le panneau de diagnostic et dans le brief généré :
        visez un commercial plutôt qu'un développeur.
      placeholder: >
        Personne ne peut appuyer pour appeler depuis un téléphone, et c'est
        invisible pour les moteurs de recherche — chaque visiteur mobile qui
        voulait appeler est perdu.
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Sens
      options:
        - "Défaut — augmente le score d'opportunité"
        - "Atout — le diminue (bonus d'attractivité)"
    validations:
      required: true

  - type: textarea
    id: detection
    attributes:
      label: Comment le détecter de façon fiable
      description: >
        Soyez concret, et honnête sur les faux positifs. Un signal qui se
        déclenche à tort sur un tiers des sites est pire que pas de signal, car
        il érode la confiance dans tout le score.
      placeholder: >
        Aucun lien `tel:` dans la page, mais une `<img>` dont l'alt ou le nom de
        fichier correspond à /t[ée]l|phone|contact/.
    validations:
      required: true

  - type: input
    id: weight
    attributes:
      label: Poids suggéré
      description: >
        Un ordre de grandeur en points sur 100, pour comparaison. Repères
        existants : pas de site du tout vaut 80 (`NO_SITE_BASE`), et l'ensemble
        des défauts est plafonné à 85 (`MAX_DEFECTS`).
      placeholder: "4"

  - type: textarea
    id: examples
    attributes:
      label: Exemples réels
      description: >
        Des URL publiques où c'est visible, si vous en avez. Ça aide à
        construire une fixture sous `fixtures/site/`.
