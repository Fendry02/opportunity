name: Rapport de bug
description: Quelque chose se comporte autrement que documenté.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Essayez d'abord de reproduire en mode mock (`MOCK_EXTERNAL=1`). Si ça se
        reproduit là, n'importe qui peut déboguer sans clé Google — ce qui rend
        un correctif bien plus probable.

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s'est passé
      description: Ce que vous avez observé, et ce que vous attendiez à la place.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. npm run dev
        2. Rechercher « … » avec un rayon de …
        3. Cliquer sur …
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - "Mock (MOCK_EXTERNAL=1)"
        - "Google Places réel (MOCK_EXTERNAL=0)"
        - "Les deux"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Version de Node
      description: Sortie de `node -v`.
      placeholder: v22.11.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Système d'exploitation
      placeholder: macOS 15.1 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: checks
    attributes:
      label: Sortie des commandes de vérification
      description: >
        Collez les échecs éventuels de `npm run lint`, `npm run typecheck`,
        `npm test`, `npm run db:check`. Laissez vide si tout passe.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs pertinents
      description: >
        Console serveur et/ou console du navigateur. **Masquez toute clé d'API**
        avant de coller.
      render: shell
